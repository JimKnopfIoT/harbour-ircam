<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 45° divider, bottom-left to top-right -->
  <line x1="9" y1="91" x2="91" y2="9" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- TOP-LEFT: half camera lens (flat edge on the diagonal) with aperture blades -->
  <g stroke="#ffffff" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31.5,68.5 A26,26 0 0 1 68.5,31.5"/>            <!-- outer half-lens -->
    <path d="M40.8,59.2 A13,13 0 0 1 59.2,40.8"/>            <!-- inner aperture -->
    <line x1="50" y1="50" x2="50" y2="34"/>                  <!-- blade: up -->
    <line x1="50" y1="50" x2="38.7" y2="38.7"/>              <!-- blade: up-left -->
    <line x1="50" y1="50" x2="34" y2="50"/>                  <!-- blade: left -->
  </g>

  <!-- BOTTOM-RIGHT: end of a film strip, aligned with the diagonal -->
  <g transform="translate(68,68) rotate(-45)" stroke="#ffffff" fill="none" stroke-width="3" stroke-linejoin="round">
    <rect x="-18" y="-14" width="34" height="28" rx="2"/>   <!-- strip body -->
    <g fill="#ffffff" stroke="none">
      <rect x="-14" y="-11" width="5" height="4" rx="1"/>
      <rect x="-4"  y="-11" width="5" height="4" rx="1"/>
      <rect x="6"   y="-11" width="5" height="4" rx="1"/>
      <rect x="-14" y="7"   width="5" height="4" rx="1"/>
      <rect x="-4"  y="7"   width="5" height="4" rx="1"/>
      <rect x="6"   y="7"   width="5" height="4" rx="1"/>
    </g>
    <line x1="-1" y1="-5" x2="-1" y2="5"/>                   <!-- frame divider -->
  </g>
</svg>
