<?xml version="1.0" encoding="UTF-8"?>
<!--
  harbour-ircam app icon.

  SILHOUETTE
  The Sailfish app-icon shape shared by harbour-pipecam / harbour-sflipper —
  one sharp corner, three corners rounded at R=86 — turned a quarter turn
  anticlockwise, so the sharp corner sits bottom-left.

  MOTIF — "a thermal lens"
  A lens barrel seen head-on. Instead of glossy glass, IR optics have a flat,
  matte window in front of the sensor, so the disc is drawn FLAT: no specular
  highlight, no vignette — just the lava gradient the thermal picture uses,
  the full Inferno ramp laid diagonally from deep violet at the bottom left to
  pale yellow at the top right — a violet-to-yellow ramp. A
  small white thermometer stands in the right half of the window with three
  tiny tick marks as a scale.

  Sizes are generated by scripts/make-icons.sh (86/108/128/172 for harbour,
  plus the cover tile crop).

  Copyright (C) 2026  JimKnopfIoT - GPLv3 or later.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="172" height="172" viewBox="0 0 172 172">
  <defs>
    <!-- Cold steel tile, same as harbour-pipecam: the family look. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4F5C"/>
      <stop offset="1" stop-color="#141F26"/>
    </linearGradient>

    <!-- Lens barrel: dark metal, slightly lighter at the top edge. -->
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A353C"/>
      <stop offset="1" stop-color="#080C10"/>
    </linearGradient>

    <!-- The lava: full Inferno ramp, deep violet (bottom-left) to pale yellow
         (top-right). A flat matte fill — no gloss. -->
    <linearGradient id="lava" gradientUnits="userSpaceOnUse"
                    x1="43" y1="129" x2="129" y2="43">
      <stop offset="0.00" stop-color="#3b1560"/>
      <stop offset="0.22" stop-color="#7d1f7a"/>
      <stop offset="0.42" stop-color="#c0392f"/>
      <stop offset="0.62" stop-color="#e86a1f"/>
      <stop offset="0.82" stop-color="#f9a825"/>
      <stop offset="1.00" stop-color="#fcffa4"/>
    </linearGradient>

    <clipPath id="tileClip">
      <path d="M0,172 L0,86 A86,86 0 0 1 86,0 A86,86 0 0 1 172,86 A86,86 0 0 1 86,172 Z"/>
    </clipPath>
  </defs>

  <!-- Tile: sharp corner bottom-left. -->
  <path fill="url(#tile)" d="M0,172 L0,86 A86,86 0 0 1 86,0 A86,86 0 0 1 172,86 A86,86 0 0 1 86,172 Z"/>

  <g clip-path="url(#tileClip)">
    <!-- Lens barrel: outer dark ring with a thin machined bevel on its inner
         edge. The bevel is a flat ring, not a highlight. -->
    <circle cx="86" cy="86" r="76" fill="url(#barrel)"/>
    <circle cx="86" cy="86" r="76" fill="none" stroke="#5C7180" stroke-width="1.5" opacity="0.6"/>
    <circle cx="86" cy="86" r="63" fill="none" stroke="#4A5A66" stroke-width="3"/>

    <!-- The flat matte IR window. -->
    <circle cx="86" cy="86" r="60" fill="url(#lava)"/>

    <!-- Thermometer, small, in the right half of the window: outline tube,
         solid bulb, the column inside, three ticks. -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <rect x="106.5" y="60" width="9" height="44" rx="4.5" stroke-width="3"/>
      <line x1="111" y1="76" x2="111" y2="103" stroke-width="3.5"/>
      <line x1="120" y1="69" x2="125" y2="69" stroke-width="2"/>
      <line x1="120" y1="79" x2="125" y2="79" stroke-width="2"/>
      <line x1="120" y1="89" x2="125" y2="89" stroke-width="2"/>
    </g>
    <circle cx="111" cy="108" r="7.5" fill="#FFFFFF"/>
  </g>
</svg>
